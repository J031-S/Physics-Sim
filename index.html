<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Physics Sim · Sandbox</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <a class="brand" href="./"><span>φ</span> Physics Sim</a
      ><span class="subtitle">A simple mechanics sandbox</span>
      <div class="playback">
        <button id="pause">Ⅱ Pause</button
        ><button id="clear">Clear scene</button>
      </div>
    </header>
    <main>
      <canvas
        id="canvas"
        tabindex="0"
        aria-label="Physics sandbox. Choose Ball or Block, then click to create. Drag to throw. Hold Control to snap."
      ></canvas>
      <div class="tools" role="toolbar" aria-label="Creation tools">
        <button data-tool="grab" class="active" aria-pressed="true">
          <b>↖</b> Grab</button
        ><button data-tool="ball" aria-pressed="false"><b>○</b> Ball</button
        ><button data-tool="block" aria-pressed="false"><b>□</b> Block</button
        ><span class="divider"></span
        ><button data-tool="spring" aria-pressed="false"><b>∿</b> Spring</button
        ><button data-tool="rod" aria-pressed="false"><b>⊶</b> Rod</button
        ><label class="vectors"
          ><input type="checkbox" id="vectors" /> Velocity vectors</label
        >
      </div>
      <div id="selection" class="selection" hidden>
        <strong id="selected-name"></strong
        ><label
          ><input type="checkbox" id="lock-position" /> Lock position</label
        ><label
          ><input type="checkbox" id="lock-rotation" /> Lock rotation</label
        ><button id="delete" title="Delete selected object or connection">
          Delete
        </button>
      </div>
      <div class="hint" id="hint">
        Add a ball or block, then grab and throw it. Right-click for material
        constants.
      </div>
      <div class="status">
        <span id="snap-status">Grid: 0.5 m · hold Ctrl to snap</span
        ><span id="time">0.00 s</span>
      </div>
      <div id="toast" role="status" aria-live="polite"></div>
    </main>
    <section
      id="material-menu"
      role="dialog"
      aria-labelledby="menu-title"
      hidden
    >
      <div class="menu-header">
        <strong id="menu-title">Material constants</strong
        ><button id="close-menu" aria-label="Close material constants">
          ×
        </button>
      </div>
      <p id="menu-note">Changes apply while the simulation runs.</p>
      <form id="constants"></form>
    </section>
    <script src="vendor/matter.js"></script>
    <script type="module" src="src/app.js"></script>
  </body>
</html>
