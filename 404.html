<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Physium · Page not found</title>
    <!-- GitHub Pages serves this file at whatever address was not found, so
         every path here is from the site root (https://physium.j031.dev/). -->
    <link rel="icon" type="image/svg+xml" href="/assets/logo.svg" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="doc-page" data-page="not-found">
    <header>
      <a class="brand"></a>
      <nav class="site-nav"></nav>
      <div class="playback">
        <button
          id="settings-toggle"
          title="Settings"
          aria-expanded="false"
          aria-controls="settings-panel"
        >
          Settings
        </button>
      </div>
    </header>
    <main id="not-found" class="doc-main">
      <h1>Page not found</h1>
      <p>
        There is no page at <code id="missing-path"></code>. It may have moved
        when the site became Physium.
      </p>
      <p><a id="home-link" href="/">Go to the Physium homepage</a></p>
    </main>
    <section id="settings-panel" hidden aria-labelledby="settings-title">
      <div class="menu-header">
        <strong id="settings-title">Settings</strong
        ><button id="close-settings" aria-label="Close settings">×</button>
      </div>
      <details id="website-settings" class="settings-section" open></details>
    </section>
    <script type="module" src="/src/site/not-found.js"></script>
  </body>
</html>
